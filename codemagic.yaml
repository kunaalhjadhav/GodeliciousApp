workflows:
  ios-release:
    name: iOS App Store Release & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: in.godelicious.app
      vars:
        XCODE_WORKSPACE: "GodeliciousApp.xcworkspace"
        XCODE_SCHEME: "GodeliciousApp"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci --legacy-peer-deps || npm install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: key
        submit_to_testflight: true
        submit_to_app_store: false

  ios-simulator-build:
    name: iOS Simulator Build (for Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "GodeliciousApp.xcworkspace"
        XCODE_SCHEME: "GodeliciousApp"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build Release app for iOS Simulator
        script: |
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build"
      - name: Zip the app for upload
        script: |
          cd "$CM_BUILD_DIR/build/Build/Products/Release-iphonesimulator"
          zip -r "$CM_BUILD_DIR/GodeliciousApp-simulator.zip" GodeliciousApp.app
    artifacts:
      - GodeliciousApp-simulator.zip