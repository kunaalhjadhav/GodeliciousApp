# Codemagic: build the Godelicious iPhone app and upload it to TestFlight / App Store Connect.
# Put this file in the root of the GodeliciousApp repository (next to package.json).
workflows:
  ios-release:
    name: Godelicious iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the name you gave the App Store Connect API key in
      # Codemagic > Team settings > Integrations > Developer Portal.
      app_store_connect: Godelicious ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: in.godelicious.app
      vars:
        XCODE_WORKSPACE: "ios/GodeliciousApp.xcworkspace"
        XCODE_SCHEME: "GodeliciousApp"
        # Numeric "Apple ID" of the app: App Store Connect > your app > App Information
        APP_STORE_APPLE_ID: 0000000000
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm packages
        script: npm install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number (one higher than the last upload)
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          LATEST=${LATEST:-0}
          agvtool new-version -all $((LATEST + 1))
      - name: Build the .ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
